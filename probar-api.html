<!DOCTYPE html>
<!--
  Archivo: probar-api.html
  Dónde va: GitHub, repositorio inventario-klagges (raíz)
  Entrega 1B · Hito 1
  Página temporal para probar la API desde github.io. Se elimina al terminar el Hito 2.
-->
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Probar API · Inventario Klagges</title>
  <style>
    :root {
      --fondo: #f5f7fa;
      --tarjeta: #ffffff;
      --texto: #1f2933;
      --suave: #616e7c;
      --borde: #d3d9e0;
      --primario: #1a73e8;
      --primario-texto: #ffffff;
      --ok: #1b7f3b;
      --error: #b42318;
      --codigo: #eef1f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #12181f;
        --tarjeta: #1c242d;
        --texto: #e4e7eb;
        --suave: #9aa5b1;
        --borde: #2f3a46;
        --primario: #8ab4f8;
        --primario-texto: #0b1a2e;
        --ok: #4ade80;
        --error: #f87171;
        --codigo: #11171d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--texto);
      background: var(--fondo);
    }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 24px; margin: 8px 0 4px; }
    h2 { font-size: 18px; margin: 0 0 8px; }
    .nota { color: var(--suave); margin: 0 0 16px; }
    section {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input {
      width: 100%;
      font-size: 16px;
      padding: 12px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: var(--fondo);
      color: var(--texto);
    }
    button {
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: 600;
      border: 0;
      border-radius: 8px;
      background: var(--primario);
      color: var(--primario-texto);
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .fila { display: flex; gap: 8px; }
    .fila button { flex: 1; }
    .estado { margin: 12px 0 0; font-weight: 600; }
    .estado.ok { color: var(--ok); }
    .estado.error { color: var(--error); }
    pre {
      margin: 0;
      padding: 12px;
      background: var(--codigo);
      border-radius: 8px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 480px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>Probar API</h1>
    <p class="nota">Inventario Klagges · página temporal del Hito 1 para probar el servidor desde github.io.</p>

    <section>
      <h2>1. Conexión</h2>
      <label for="url">URL de la API</label>
      <input id="url" type="url" autocomplete="off" spellcheck="false">
      <button id="btn-ping" type="button">Probar conexión (ping)</button>
      <p id="estado-conexion" class="estado"></p>
    </section>

    <section>
      <h2>2. Ingreso</h2>
      <form id="form-login">
        <label for="usuario">Usuario</label>
        <input id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="pin">PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" required>
        <button id="btn-login" type="submit">Ingresar</button>
      </form>
      <p id="estado-sesion" class="estado">Sin sesión.</p>
      <div class="fila">
        <button id="btn-sesion" type="button" disabled>Validar sesión</button>
        <button id="btn-salir" type="button" disabled>Cerrar sesión</button>
      </div>
    </section>

    <section>
      <h2>3. Registro de llamadas</h2>
      <pre id="registro" aria-live="polite">Aún no hay llamadas.</pre>
    </section>
  </main>

  <script>
    // URL de la API publicada en Apps Script. No es secreta: la seguridad la da el login.
    const URL_API = 'https://script.google.com/macros/s/AKfycbyO_sPBaRgRyshDcW2H_rq5cOApa3KsNcq2gGY2xiHOLIvhJypl6zGY4Se-JVSmwwmH/exec';

    // El token vive solo en la memoria de esta página: al recargarla, se pierde.
    let token = '';
    let hayRegistros = false;
    const $ = id => document.getElementById(id);

    $('url').value = URL_API;

    /** Llama a la API con {accion, token, datos} como texto plano y devuelve {ok, datos, error}. */
    async function llamarApi(accion, datos, conToken) {
      const cuerpo = { accion: accion, datos: datos || {} };
      if (conToken) cuerpo.token = token;
      const inicio = Date.now();
      let respuesta;
      try {
        const http = await fetch($('url').value.trim(), { method: 'POST', body: JSON.stringify(cuerpo) });
        const texto = await http.text();
        try {
          respuesta = JSON.parse(texto);
        } catch (error) {
          respuesta = { ok: false, datos: null, error: { codigo: 'RESPUESTA_NO_JSON', mensaje:
            'La API respondió algo que no es JSON. Revisa que la implementación tenga acceso "Cualquier persona".' } };
        }
      } catch (error) {
        respuesta = { ok: false, datos: null, error: { codigo: 'SIN_CONEXION', mensaje:
          'No se pudo llegar a la API (' + error.message + '). Revisa la URL y tu conexión.' } };
      }
      if (accion === 'login' && respuesta.ok) token = respuesta.datos.token;
      registrar(accion, respuesta, Date.now() - inicio);
      return respuesta;
    }

    /** Agrega la llamada arriba del registro. El token se muestra recortado. */
    function registrar(accion, respuesta, milisegundos) {
      const hora = new Date().toLocaleTimeString('es-CL', { timeZone: 'America/Santiago' });
      const resultado = respuesta.ok ? 'OK' : '✗ ' + respuesta.error.codigo + ': ' + respuesta.error.mensaje;
      let detalle = JSON.stringify(respuesta, null, 2);
      if (token) detalle = detalle.split(token).join(token.slice(0, 8) + '…');
      const entrada = hora + ' · ' + accion + ' · ' + milisegundos.toLocaleString('es-CL') + ' ms\n' +
        resultado + '\n' + detalle;
      $('registro').textContent = entrada + (hayRegistros ? '\n\n' + $('registro').textContent : '');
      hayRegistros = true;
    }

    function mostrarEstado(id, texto, tipo) {
      $(id).textContent = texto;
      $(id).className = 'estado' + (tipo ? ' ' + tipo : '');
    }

    /** Desactiva los botones mientras espera una respuesta, para no enviar dos veces. */
    async function conBotonesOcupados(tarea) {
      const botones = ['btn-ping', 'btn-login', 'btn-sesion', 'btn-salir'];
      botones.forEach(id => { $(id).disabled = true; });
      try {
        return await tarea();
      } finally {
        $('btn-ping').disabled = false;
        $('btn-login').disabled = false;
        $('btn-sesion').disabled = !token;
        $('btn-salir').disabled = !token;
      }
    }

    async function probarConexion() {
      mostrarEstado('estado-conexion', 'Esperando respuesta…');
      const r = await conBotonesOcupados(() => llamarApi('ping'));
      if (r.ok) {
        mostrarEstado('estado-conexion', 'Conectado: ' + r.datos.app + ' · versión ' + r.datos.version +
          ' · planilla "' + r.datos.planilla + '".', 'ok');
      } else {
        mostrarEstado('estado-conexion', r.error.mensaje, 'error');
      }
    }

    async function ingresar(evento) {
      evento.preventDefault();
      const usuario = $('usuario').value.trim();
      const pin = $('pin').value.trim();
      $('pin').value = '';
      mostrarEstado('estado-sesion', 'Esperando respuesta…');
      const plataforma = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || 'navegador';
      const r = await conBotonesOcupados(() => llamarApi('login', { usuario: usuario, pin: pin,
        dispositivo: 'probar-api · ' + plataforma }));
      if (r.ok) {
        const u = r.datos.usuario;
        mostrarEstado('estado-sesion', 'Sesión activa: ' + u.nombre + ' (' + u.usuario + ') · ' + u.rol +
          ' · vence ' + r.datos.expira_en.replace('T', ' ').slice(0, 16) + '.', 'ok');
      } else {
        mostrarEstado('estado-sesion', r.error.mensaje, 'error');
      }
    }

    async function validarSesion() {
      const r = await conBotonesOcupados(() => llamarApi('sesion', {}, true));
      if (r.ok) mostrarEstado('estado-sesion', 'La sesión es válida: ' + r.datos.usuario.usuario + '.', 'ok');
      else mostrarEstado('estado-sesion', r.error.mensaje, 'error');
    }

    async function cerrarSesion() {
      const r = await conBotonesOcupados(() => llamarApi('cerrar_sesion', {}, true));
      if (r.ok) {
        mostrarEstado('estado-sesion', 'Sesión cerrada en el servidor. Presiona "Validar sesión" para ' +
          'comprobar que el token ya no sirve.', 'ok');
      } else {
        mostrarEstado('estado-sesion', r.error.mensaje, 'error');
      }
    }

    $('btn-ping').addEventListener('click', probarConexion);
    $('form-login').addEventListener('submit', ingresar);
    $('btn-sesion').addEventListener('click', validarSesion);
    $('btn-salir').addEventListener('click', cerrarSesion);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario Klagges</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #1f2933;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    main {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      padding: 24px;
      max-width: 360px;
      width: calc(100% - 32px);
      text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 8px 0; }
    .estado { font-weight: 600; }
    .conectado { color: #1b7f3b; }
    .sin-conexion { color: #b42318; }
    small { color: #616e7c; }
    @media (prefers-color-scheme: dark) {
      body { color: #e4e7eb; background: #12181f; }
      main { background: #1c242d; box-shadow: none; }
      small { color: #9aa5b1; }
      .conectado { color: #4ade80; }
      .sin-conexion { color: #f87171; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Inventario Klagges</h1>
    <p>Página de prueba: GitHub Pages está publicando correctamente.</p>
    <p class="estado" id="estado">Verificando conexión…</p>
    <p><small>Versión <span id="version"></span> · <span id="hora"></span></small></p>
  </main>

  <script>
    // Versión de la app (se sube cada vez que cambie el frontend)
    var APP_VERSION = "0.0.1-prueba";

    document.getElementById("version").textContent = APP_VERSION;
    document.getElementById("hora").textContent = new Date().toLocaleString("es-CL", {
      timeZone: "America/Santiago"
    });

    // Muestra si el teléfono tiene señal en este momento
    function actualizarEstado() {
      var elemento = document.getElementById("estado");
      if (navigator.onLine) {
        elemento.textContent = "Con conexión";
        elemento.className = "estado conectado";
      } else {
        elemento.textContent = "Sin conexión";
        elemento.className = "estado sin-conexion";
      }
    }

    window.addEventListener("online", actualizarEstado);
    window.addEventListener("offline", actualizarEstado);
    actualizarEstado();
  </script>
</body>
</html>
